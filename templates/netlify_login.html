<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Login | ALAMIN HOSTING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0c0e14; font-family: 'Segoe UI', sans-serif; }
        .login-card { background: #12141c; border: 1px solid #1e2130; }
        .input-field { background: #0c0e14; border: 1px solid #2a2d37; transition: all 0.2s; }
        .input-field:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15); }
        .btn-glow { background: linear-gradient(135deg, #06b6d4, #0891b2); transition: all 0.3s; }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4); }
        .bg-pattern {
            background-image: radial-gradient(circle at 20% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-pattern">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-700 mb-4 shadow-lg shadow-cyan-500/20">
                <i class="fas fa-rocket text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-black text-white">NETLIFY <span class="text-cyan-400">HOSTING</span></h1>
            <p class="text-gray-500 text-sm mt-2">Deploy static sites instantly</p>
        </div>

        <div class="login-card rounded-2xl p-8 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-1">
                <i class="fas fa-sign-in-alt text-cyan-400 mr-2"></i>Sign In
            </h2>
            <p class="text-gray-500 text-xs mb-6">Enter your Netlify account credentials</p>

            {% if error %}
            <div class="bg-red-500/10 border border-red-500/30 rounded-lg p-3 mb-4">
                <p class="text-red-400 text-sm">
                    <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
                </p>
            </div>
            {% endif %}

            <form method="POST" action="">
                <div class="mb-4">
                    <label class="block text-gray-400 text-xs mb-2 font-semibold">
                        <i class="fas fa-user mr-1"></i>USERNAME
                    </label>
                    <input type="text" name="username" required autofocus
                        placeholder="Enter username"
                        class="input-field w-full rounded-lg px-4 py-3 text-white text-sm outline-none">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-400 text-xs mb-2 font-semibold">
                        <i class="fas fa-lock mr-1"></i>PASSWORD
                    </label>
                    <input type="password" name="password" required
                        placeholder="Enter password"
                        class="input-field w-full rounded-lg px-4 py-3 text-white text-sm outline-none">
                </div>

                <button type="submit"
                    class="btn-glow w-full py-3 rounded-lg text-white font-bold">
                    <i class="fas fa-rocket mr-2"></i>Sign In to Netlify
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-gray-800">
                <p class="text-gray-500 text-xs text-center">
                    Don't have Netlify access? 
                    <a href="/" class="text-cyan-400 hover:text-cyan-300">Contact Admin</a>
                </p>
            </div>
        </div>

        <div class="text-center mt-6">
            <p class="text-gray-600 text-xs">
                <i class="fas fa-shield-alt mr-1"></i>Secure Netlify Hosting Platform
            </p>
            <div class="flex justify-center gap-4 mt-3 text-xs">
                <a href="/" class="text-gray-500 hover:text-cyan-400">
                    <i class="fas fa-home mr-1"></i>Home
                </a>
                <a href="/login" class="text-gray-500 hover:text-cyan-400">
                    <i class="fas fa-user-shield mr-1"></i>Admin Panel
                </a>
            </div>
        </div>
    </div>

</body>
</html>
