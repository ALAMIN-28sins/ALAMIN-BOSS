<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Login</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); padding:40px;
    border-radius:20px; width:100%; max-width:400px;
    border:1px solid rgba(255,255,255,0.1); box-shadow:0 20px 60px rgba(0,0,0,0.4); }
  h1 { color:#fff; text-align:center; margin-bottom:30px; }
  .form-group { margin-bottom:20px; }
  label { display:block; color:#b0b0d0; margin-bottom:8px; font-size:0.9rem; }
  input { width:100%; padding:14px; border-radius:10px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
    color:#fff; font-size:1rem; outline:none; }
  input:focus { border-color:#00d4ff; }
  button { width:100%; padding:14px; border:none; border-radius:10px;
    background:linear-gradient(90deg,#00d4ff,#7b2ff7); color:#fff;
    font-size:1rem; font-weight:600; cursor:pointer; margin-top:10px; }
  .error { background:rgba(255,50,50,0.2); color:#ff8080; padding:12px;
    border-radius:8px; margin-bottom:20px; text-align:center; font-size:0.9rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>🚀 Server Login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="form-group">
        <label>👤 Username</label>
        <input type="text" name="username" required placeholder="your-username">
      </div>
      <div class="form-group">
        <label>🔑 Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
